mode: demo
telegram:
  channel: '-1004346298355'
  session_name: session/user
risk:
  usd_per_trade: 50.0
  max_lot_cap: 5.0
  max_trades_per_day: 20
  daily_loss_cap_usd: 200.0
guards:
  max_price_deviation_pips: 15
  max_spread_pips: 30
  # Override per simbol (canonical) — 15 pip global cuma $0.15 di GOLD (2 desimal),
  # jauh lebih kecil dari gap harga yang wajar terjadi. Tanpa ini, gap sekecil
  # $1 antara harga signal dan harga live tetap dianggap "jauh" -> pending order
  # (BUY_STOP/SELL_LIMIT dst) padahal harusnya cukup dieksekusi market.
  price_deviation_overrides:
    XAUUSD: 100
    XAGUSD: 100
  # Jarak SL minimum (satuan HARGA, bukan pip) per simbol canonical —
  # diturunkan dari 50% median jarak SL riwayat asli channel ini (6716
  # pesan). Menolak signal kalau SL kelewat dekat dari entry dibanding
  # gaya trading normal channel -- biasanya berarti salah baca/salah ketik
  # angka, bukan strategi scalping (channel ini memang scalping ketat di
  # GOLD, makanya minimumnya juga kecil, BUKAN angka global sama rata).
  min_sl_distance_overrides:
    XAUUSD: 2.0
    XAGUSD: 0.18
    NAS100: 20.0
    US30: 21.0
    SP500: 2.5
    GER40: 20.0
    EURUSD: 0.0015
    GBPUSD: 0.0015
    USDJPY: 0.15
    USDCAD: 0.0012
    GBPJPY: 0.14
    AUDUSD: 0.0012
    USOIL: 0.23
followup:
  move_sl_to_be: true
  partial_close_tp1: true
  partial_close_percent: 50
  close_all: false
