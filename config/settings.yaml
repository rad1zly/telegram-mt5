mode: demo
parser:
  # TRIAL (2026-07-30): SETIAP pesan (entry maupun follow-up) diputuskan
  # oleh SATU panggilan LLM (MiniMax), menggantikan regex sebagai pengambil
  # keputusan utama -- bukan cuma fallback. Alasan: user membaca sendiri
  # ratusan pesan channel ini secara manual dan banyak yang profitable,
  # sementara regex (walau sudah dites ~97% akurat lewat sampling manual)
  # tetap butuh puluhan iterasi aturan utk menangkap nuansa bahasa.
  # REVERT: set ke false, regex jadi pengambil keputusan utama lagi
  # (LLM cuma fallback saat regex gagal total), TANPA perlu ubah kode.
  llm_first: true
telegram:
  channel: '-1002354707631'
  session_name: session/user
risk:
  usd_per_trade: 30.0
  max_lot_cap: 5.0
  max_trades_per_day: 20
  daily_loss_cap_usd: 200.0
guards:
  max_price_deviation_pips: 15
  max_spread_pips: 30
  price_deviation_overrides:
    XAUUSD: 100
    XAGUSD: 100
  # Jarak SL minimum (satuan HARGA, bukan pip) per simbol canonical —
  # diturunkan dari 50% median jarak SL riwayat asli channel ini (6716
  # pesan). Menolak signal kalau SL kelewat dekat dari entry dibanding
  # gaya trading normal channel -- biasanya berarti salah baca/salah ketik
  # angka, bukan strategi scalping (channel ini memang scalping ketat di
  # GOLD, makanya minimumnya juga kecil, BUKAN angka global sama rata).
  min_sl_distance_overrides:
    XAUUSD: 2.0
    XAGUSD: 0.18
    NAS100: 20.0
    US30: 21.0
    SP500: 2.5
    GER40: 20.0
    EURUSD: 0.0015
    GBPUSD: 0.0015
    USDJPY: 0.15
    USDCAD: 0.0012
    GBPJPY: 0.14
    AUDUSD: 0.0012
    USOIL: 0.23
  # Koreksi offset harga (satuan HARGA) kalau broker kita punya selisih
  # KONSISTEN dan SATU ARAH dari referensi harga channel -- ditemukan lewat
  # perbandingan manual live (2026-07-30): broker selalu lebih TINGGI ~$10
  # di US30, ~$7 di NAS100. Entry/SL/TP dari signal digeser paralel sebesar
  # ini sebelum dipakai (lihat src/parser/schema.py:apply_price_offset).
  # BARU 2 simbol yang terverifikasi -- tambah simbol lain kalau memang
  # terbukti ada pola serupa, jangan sekadar diasumsikan sama.
  broker_price_offset_overrides:
    US30: 10.0
    NAS100: 7.0
followup:
  move_sl_to_be: true
  partial_close_tp1: true
  partial_close_percent: 50
  close_all: true  # channel sering kasih instruksi jelas "close the position" (368x di korpus, bukan cuma pilihan ambigu)
  # Begitu partial-close TP1 berhasil dieksekusi, SL OTOMATIS dipindah ke
  # breakeven + buffer ("SL+") -- aturan risk management sendiri, TIDAK
  # bergantung apakah channel juga bilang "pindah SL" di teksnya atau
  # tidak. Buffer = 20% dari guards.min_sl_distance_overrides (otomatis
  # menyesuaikan skala tiap instrumen, bukan angka global sama rata).
  sl_plus_buffer_overrides:
    XAUUSD: 0.4
    XAGUSD: 0.036
    NAS100: 4.0
    US30: 4.2
    SP500: 0.5
    GER40: 4.0
    EURUSD: 0.0003
    GBPUSD: 0.0003
    USDJPY: 0.03
    USDCAD: 0.00024
    GBPJPY: 0.028
    AUDUSD: 0.00024
    USOIL: 0.046
# HANYA dipakai tools/run_backtest*.py -- BELUM memengaruhi live/executor.py.
# Target TP tetap per simbol (bukan dari signal.tp channel, bukan relatif ke
# SL trade). Lihat backtest/runner.py: BacktestConfig.tp_fixed_distance_overrides.
#
# ASAL ANGKA: awalnya diturunkan sebagai persentil-40 distribusi "gerakan
# terbaik sebelum SL kena" (MFE), TAPI perhitungan itu memakai data yang
# waktunya belum dikoreksi (lihat server_timezone di bawah). Setelah koreksi,
# persentil-40 yang sebenarnya jadi berbeda -- namun angka lama di bawah ini
# tetap menghasilkan P/L lebih tinggi saat diadu ulang. Jadi angka di bawah
# DIPERTAHANKAN karena terbukti lebih baik secara empiris, TAPI jangan lagi
# disebut "persentil-40" -- itu sekadar jarak tetap hasil tuning yang
# kebetulan bagus. Hitung ulang MFE-nya kalau mau menurunkan angka baru.
#
# PENTING: dengan waktu yang sudah dikoreksi penuh (termasuk DST), TP
# CHANNEL APA ADANYA menghasilkan total P/L TERTINGGI ($10,716 vs $8,961)
# -- tapi win rate jauh lebih rendah (46.8% vs 60.4%), profit factor lebih
# rendah (1.70 vs 1.77), dan drawdown JAUH lebih dalam (70.6% vs 28.0%
# pada modal $800). Angka tetap di bawah menang telak secara risk-adjusted.
backtest:
  # Zona waktu server broker untuk file M5/tick hasil export MT5. Timestamp
  # di file itu WAKTU SERVER, bukan UTC -- sementara timestamp pesan Telegram
  # UTC asli. Tanpa koreksi ini seluruh backtest bergeser dan hasilnya tidak
  # ada artinya.
  #
  # WAJIB pakai zona bernama, BUKAN offset tetap: broker ini UTC+2 di musim
  # dingin dan UTC+3 di musim panas. Offset tetap +3 sempat dipakai dan
  # ternyata MELESET SATU JAM sepanjang November-Februari -- terlihat jelas
  # dari akurasi verifikasi klaim channel yang anjlok ke 29-50% di Jan-Feb
  # sementara Mar-Jul 76-98%.
  #
  # Diukur EMPIRIS dari korpus (bukan diasumsikan): Nov-Feb konsisten +2h,
  # Mar-Okt konsisten +3h. Tanggal peralihannya diukur per minggu dan jatuh
  # antara 1-7 Maret (+2h) dan 8-14 Maret (+3h) 2026 -- itu tanggal DST
  # AMERIKA (8 Maret), BUKAN Eropa (29 Maret). Jadi broker ini basis UTC+2
  # tapi ikut aturan DST New York, bukan Eropa.
  #
  # Dimodelkan sebagai America/New_York (UTC-5 dingin / UTC-4 panas) DITAMBAH
  # 7 jam -> UTC+2 dingin / UTC+3 panas, peralihan mengikuti New York. Aturan
  # DST-nya dibaca dari database tz sistem, jadi tetap benar tahun berikutnya
  # tanpa di-hardcode. Ukur ulang kalau ganti broker:
  #   .venv/bin/python tools/detect_server_timezone.py
  server_timezone: America/New_York
  server_timezone_extra_hours: 7
  # Cadangan kalau broker TIDAK pakai DST, atau tzdata tidak ada di mesin itu.
  # Diabaikan selama server_timezone di atas terisi.
  server_utc_offset_hours: 3.0
  tp_fixed_distance_overrides:
    XAUUSD: 4.34
    NAS100: 40.38
    US30: 43.25
    SP500: 4.64
